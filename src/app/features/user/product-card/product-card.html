<article class="shop-card">
  <a
    [routerLink]="['/products', product().id]"
    class="shop-card-image"
    [attr.aria-label]="'View ' + product().name"
  >
    @if (product().thumbnail_url) {
      <img [src]="product().thumbnail_url" [alt]="product().name" loading="lazy" />
    } @else {
      <i class="fa-solid fa-box" aria-hidden="true"></i>
    }
  </a>
  <div class="shop-card-info">
    <div class="shop-card__summary">
      <div class="shop-card__text">
        <a [routerLink]="['/products', product().id]" class="shop-card-name">{{
          product().name
        }}</a>
        <p class="shop-card__description">
          {{ product().description || 'No description provided.' }}
        </p>
      </div>
      <p class="shop-price-new">{{ product().price | currency: (product().currency || 'USD') }}</p>
    </div>
    <div
      class="shop-card__stock"
      [class.shop-card__stock--available]="availability().level === 'available'"
      [class.shop-card__stock--low]="availability().level === 'low'"
      [class.shop-card__stock--critical]="availability().level === 'critical'"
      [class.shop-card__stock--out]="availability().level === 'out'"
    >
      <i class="fa-solid fa-cube" aria-hidden="true"></i>{{ availability().label }}
    </div>
    <a [routerLink]="['/products', product().id]" class="shop-card-view"
      ><i class="fa-solid fa-eye" aria-hidden="true"></i><span>View product</span
      ><i class="fa-solid fa-arrow-right" aria-hidden="true"></i
    ></a>
  </div>
</article>
