<div class="custom-select" [class.custom-select--open]="open()" [class.custom-select--active]="active()">
  <button type="button" class="custom-select__trigger" [attr.aria-expanded]="open()" aria-haspopup="listbox" (click)="toggle()" (keydown.escape)="close()">
    <span>{{ selectedLabel() }}</span><i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
  </button>
  @if (open()) {
    <div class="custom-select__options" role="listbox" [attr.aria-label]="label()">
      @for (option of options(); track option.value) {
        <button type="button" class="custom-select__option" [class.custom-select__option--selected]="option.value === value()" role="option" [attr.aria-selected]="option.value === value()" (click)="choose(option.value)">{{ option.label }}</button>
      }
    </div>
  }
</div>
