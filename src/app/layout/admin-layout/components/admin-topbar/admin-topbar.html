<header class="topbar" role="banner">
  <!-- Left: hamburger -->
  <button
    type="button"
    class="topbar__menu-btn"
    (click)="menuToggle.emit()"
    aria-label="Toggle sidebar navigation"
    aria-controls="admin-sidebar"
    [attr.aria-expanded]="sidebarExpanded()"
  >
    <i class="fa-solid fa-bars" aria-hidden="true"></i>
  </button>

  <nav class="topbar__nav" aria-label="View navigation">
    <span class="topbar__nav-item topbar__nav-item--active" aria-current="page">
      <i class="fa-solid fa-table-list" aria-hidden="true"></i>
      <span>Admin</span>
    </span>
    <a routerLink="/products" class="topbar__nav-item topbar__nav-item--link">
      <i class="fa-solid fa-store" aria-hidden="true"></i>
      <span>User View</span>
    </a>
  </nav>

  <div class="topbar__spacer"></div>

  <!-- Right: user -->
  <div class="topbar__user">
    <span class="topbar__user-name" aria-label="Logged in as {{ currentUser()?.name ?? 'Admin' }}">
      {{ currentUser()?.name ?? 'Admin' }}
    </span>
    <div class="topbar__avatar" aria-hidden="true">
      {{ (currentUser()?.name ?? 'A').charAt(0).toUpperCase() }}
    </div>

    <button
      type="button"
      class="topbar__logout-btn"
      (click)="logout()"
      aria-label="Log out"
      title="Log out"
    >
      <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
    </button>
  </div>
</header>
